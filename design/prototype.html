<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hisaab Money Tracker</title>
<style>
/* Layout: one phone-width column on a plain white canvas, icon-only bottom bar with a floating black + button; every action opens as a black floating tray */
:root{
  --bg:#FFFFFF; --ink:#0A0A0A; --ink-2:#6C6C70; --ink-3:#AEAEB2;
  --fill:#F2F2F4; --fill-2:#E4E4E8; --line:#EDEDF0;
  --pos:#18913F; --neg:#E5342A; --warn:#C27400;
  --pos-soft:#E2F5E8; --neg-soft:#FDE8E6; --warn-soft:#FFF1DA;
  --accent:#FF9F0A; --accent-2:#FF6A00;
  --btn-bg:#0A0A0A; --btn-fg:#FFFFFF;
  --chart-in:#18913F; --chart-out:#0A0A0A;
  --backdrop:rgba(0,0,0,.32);
  --shadow:0 10px 30px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.08);
  --t-bg:#0B0B0C; --t-card:#1C1C1E; --t-card-2:#2C2C2E; --t-ink:#FFFFFF; --t-ink-2:#A1A1A6; --t-ink-3:#636366; --t-line:#252527;
  --t-pos:#4ADE80; --t-neg:#FF6B61; --t-warn:#FFB340;
  --f-ui:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.32,1.28,.52,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --ink:#F5F5F7; --ink-2:#98989D; --ink-3:#5A5A5E;
  --fill:#1C1C1E; --fill-2:#2C2C2E; --line:#1C1C1E;
  --pos:#4ADE80; --neg:#FF6B61; --warn:#FFB340;
  --pos-soft:rgba(74,222,128,.14); --neg-soft:rgba(255,107,97,.16); --warn-soft:rgba(255,179,64,.16);
  --btn-bg:#F5F5F7; --btn-fg:#000000; --chart-in:#4ADE80; --chart-out:#F5F5F7;
  --backdrop:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.6);
  --t-bg:#161618; --t-card:#242427; --t-card-2:#333336; --t-line:#2A2A2D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#F5F5F7; --ink-2:#98989D; --ink-3:#5A5A5E;
  --fill:#1C1C1E; --fill-2:#2C2C2E; --line:#1C1C1E;
  --pos:#4ADE80; --neg:#FF6B61; --warn:#FFB340;
  --pos-soft:rgba(74,222,128,.14); --neg-soft:rgba(255,107,97,.16); --warn-soft:rgba(255,179,64,.16);
  --btn-bg:#F5F5F7; --btn-fg:#000000; --chart-in:#4ADE80; --chart-out:#F5F5F7;
  --backdrop:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.6);
  --t-bg:#161618; --t-card:#242427; --t-card-2:#333336; --t-line:#2A2A2D;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:12px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.press{transition:transform .14s ease}
.press:active{transform:scale(.96)}

#app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#screen{padding-inline:20px}

.topbar{display:flex;align-items:center;gap:10px;padding-block:14px 6px}
.avatar-me{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FFC247,var(--accent) 55%,var(--accent-2));display:grid;place-items:center;color:#fff;flex:none}
.title-name{font-size:25px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0}
.hbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;flex:none}
.hbtn:hover{background:var(--fill)}
.screen-title{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:4px 0 0;flex:1}

.klabel{font-size:15px;color:var(--ink-2);font-weight:500}
.big{font-family:var(--f-num);font-weight:800;font-size:clamp(40px,12vw,52px);letter-spacing:-.035em;line-height:1.02;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.big .dim{color:var(--ink-3)}
.sub{font-size:15px;color:var(--ink-2)}
.chips-inline{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.statchip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;background:var(--fill);font-size:13.5px;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.statchip .ic{color:var(--ink-2)}
.statchip.pos .ic,.statchip.pos b{color:var(--pos)}

.ttabs{display:flex;align-items:baseline;gap:14px;margin-top:26px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ttab{font-size:16px;font-weight:700;color:var(--ink-3);letter-spacing:-.01em}
.ttab[aria-selected="true"]{color:var(--ink)}
.ttabs .right{margin-left:auto;white-space:nowrap;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ttabs .right.link{font-size:14.5px;color:var(--ink-2);font-weight:600}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:10px 0;text-align:left;border-radius:14px}
.row:hover{background:var(--fill);box-shadow:-10px 0 0 var(--fill),10px 0 0 var(--fill)}
.ico{position:relative;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--c);color:#fff}
.ico.mono{background:var(--ink);color:var(--bg)}
.ico.soft{background:var(--fill);color:var(--ink)}
.ico.sm{width:36px;height:36px}
.ico.xl{width:64px;height:64px}
.ico .bdg{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--pos);color:#fff;box-shadow:0 0 0 2.5px var(--bg)}
.ico .bdg.rec{background:var(--ink-2)}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.r-over{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-title{font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.r-sub{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-end{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;max-width:50%}
.amt{font-size:16.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.pos{color:var(--pos)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;border:1px solid var(--fill-2);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tag.due{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.tag.over{border-color:transparent;background:var(--neg-soft);color:var(--neg)}
.tag.off{border-style:dashed}
.ghead{font-size:17px;font-weight:700;letter-spacing:-.01em;padding:22px 0 4px}
.ghead .muted{color:var(--ink-3);font-weight:600}
.empty{padding:36px 12px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{color:var(--ink);font-size:17px}
.dots{width:44px;height:44px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink-2)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);font-weight:600;font-size:17px;width:100%}
.btn[aria-disabled="true"]{background:var(--fill-2);color:var(--ink-3)}
.btn-2{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:999px;background:var(--fill);color:var(--ink);font-weight:600;width:100%}
.btn-2.danger{color:var(--neg);background:var(--neg-soft)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:var(--fill);font-weight:600;font-size:14.5px;white-space:nowrap}
.pill.dark{background:var(--btn-bg);color:var(--btn-fg)}
.link{color:var(--ink-2);font-weight:600;font-size:15px}
.dashed{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px dashed var(--fill-2);color:var(--ink-2);font-size:15px;font-weight:500;margin-top:16px;text-align:center}
.dashed b{color:var(--ink)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn-row.three{grid-template-columns:1fr 1fr 1fr}
.btn-row .btn{height:50px;font-size:16px}
.vstack{display:flex;flex-direction:column;gap:10px;margin-top:20px}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.tab{display:grid;place-items:center;height:44px;color:var(--ink-3);border-radius:14px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ti{background:var(--ink);color:var(--bg);border-radius:9px}
.ti{width:34px;height:30px;display:grid;place-items:center}
.fab{position:absolute;right:18px;top:-76px;width:58px;height:58px;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .2s var(--spring)}
.fab:active{transform:scale(.9)}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:10px 4px;margin-inline:-20px;padding-inline:20px}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:var(--fill);padding:0 12px;color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink);font-size:16px}
.search input::placeholder{color:var(--ink-3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--fill);font-weight:600;font-size:14.5px;white-space:nowrap}
.chip .ic{color:var(--ink-2)}
.chip.on{background:var(--btn-bg);color:var(--btn-fg)}
.chip.on .ic{color:var(--btn-fg)}
.chip-x{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(127,127,127,.35);margin-right:-4px}
.sumline{font-size:14px;color:var(--ink-2);padding-top:10px;display:flex;gap:14px;flex-wrap:wrap}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.chart text.on{fill:var(--ink);font-weight:700}
.mpills{display:flex;justify-content:space-between;gap:4px;margin-top:10px}
.mpill{flex:1;height:34px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-3);text-align:center}
.mpill[aria-pressed="true"]{background:var(--fill);color:var(--ink)}
.mpill[disabled]{opacity:.35;cursor:default}
.duo{display:grid;grid-template-columns:1fr 1fr;margin-top:22px}
.duo>div{text-align:center;padding:4px 8px;min-width:0}
.duo>div+div{border-left:1px solid var(--fill-2)}
.duo .k{font-size:14px;color:var(--ink-2)}
.duo .v{font-family:var(--f-num);font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.section{margin-top:30px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shead h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.shead .cap{font-size:13.5px;color:var(--ink-2)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.dash{height:0;width:14px;border-top:2px dashed var(--ink-3);border-radius:0;vertical-align:3px}
.stackbar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:14px 0 4px}
.stackbar span{display:block;height:100%;background:var(--c);min-width:3px}
.delta{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap}
.delta.up{background:var(--neg-soft);color:var(--neg)}
.delta.down{background:var(--pos-soft);color:var(--pos)}
.delta.flat{background:var(--fill);color:var(--ink-2)}
.budget{margin:-4px 0 8px 50px}
.meter{height:5px;border-radius:99px;background:var(--fill);overflow:hidden}
.meter>span{display:block;height:100%;border-radius:99px;background:var(--ink)}
.meter.warn>span{background:var(--warn)}
.meter.over>span{background:var(--neg)}
.budget .bt{font-size:12.5px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--fill);border-radius:22px;padding:16px;min-width:0}
.tile .k{font-size:13.5px;color:var(--ink-2);font-weight:500}
.tile .v{font-family:var(--f-num);font-size:23px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.1;letter-spacing:-.02em}
.tile .s{font-size:13px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob{display:flex;gap:14px;align-items:flex-start;padding:10px 0}
.ob p{margin:0;font-size:15.5px;line-height:1.4;padding-top:8px;min-width:0}
.ob b{font-weight:700}
.foot{font-size:12.5px;color:var(--ink-3);margin-top:22px;line-height:1.5}

#sheets{position:relative;z-index:50}
.sheet-wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-end}
.backdrop{position:absolute;inset:0;background:var(--backdrop);opacity:0;transition:opacity .25s}
.sheet{
  --bg:var(--t-bg); --ink:var(--t-ink); --ink-2:var(--t-ink-2); --ink-3:var(--t-ink-3);
  --fill:var(--t-card); --fill-2:var(--t-card-2); --line:var(--t-line);
  --pos:var(--t-pos); --neg:var(--t-neg); --warn:var(--t-warn);
  --pos-soft:rgba(74,222,128,.14); --neg-soft:rgba(255,107,97,.16); --warn-soft:rgba(255,179,64,.16);
  --btn-bg:#FFFFFF; --btn-fg:#000000; --chart-out:#FFFFFF;
  color-scheme:dark;
  position:relative;width:calc(100% - 16px);max-width:464px;max-height:calc(100% - 56px);margin-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--bg);color:var(--ink);border-radius:34px;overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(calc(100% + 40px));transition:transform .5s var(--spring);
  padding:0 20px 22px;box-shadow:var(--shadow)
}
.sheet.full{width:100%;max-width:480px;height:100%;max-height:100%;margin:0;border-radius:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.open .backdrop{opacity:1}
.open .sheet{transform:none}
.sheet-wrap.closing .sheet{transition:transform .26s cubic-bezier(.4,0,1,1);transform:translateY(calc(100% + 40px))}
.sheet-wrap.closing .backdrop{opacity:0}
@media (min-width:560px){
  .sheet-wrap{align-items:center}
  .sheet{margin-bottom:0}
  .sheet.full{height:min(860px,94%);border-radius:34px}
}
.grab{width:38px;height:5px;border-radius:9px;background:var(--fill-2);margin:10px auto 0}
.shd{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px 8px;z-index:3}
.shd h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1}
.shd h3.c{text-align:center;font-size:17px;font-weight:600}
.cbtn{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none;color:var(--ink)}
.sbody{flex:1;overflow-y:auto;min-height:0;margin-inline:-20px;padding-inline:20px;display:flex;flex-direction:column}
.seg{display:flex;background:var(--fill);border-radius:999px;padding:3px;gap:3px;flex:none}
.seg button{flex:1;height:34px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--ink-2);text-align:center;white-space:nowrap;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--fill-2);color:var(--ink)}
.field-row{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:16px;min-height:50px;padding:6px 8px 6px 14px;margin-top:10px;flex:none}
.field-row .lb{color:var(--ink-2);font-size:15px;flex:none;min-width:40px}
.accpill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 4px;border-radius:999px;background:var(--fill-2);font-weight:600;font-size:15px;max-width:100%;min-width:0}
.accpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accpill .ico{width:26px;height:26px}
.accpill .ico b{font-size:12px!important}
.amount{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;padding:14px 0}
.bigamt{font-family:var(--f-num);font-weight:800;font-size:clamp(48px,17vw,72px);letter-spacing:-.04em;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.bigamt .sym{font-size:.5em;color:var(--ink-2);font-weight:700;margin-right:6px;vertical-align:.5em;letter-spacing:0}
.bigamt.empty{color:var(--ink-3)}
.bigamt.pop{animation:pop .22s var(--spring)}
@keyframes pop{0%{transform:scale(.94)}100%{transform:none}}
.amount .under{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--ink-2);font-size:15px;font-variant-numeric:tabular-nums}
.amount .under i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--fill);font-style:normal;font-size:12px}
.err{color:var(--neg);font-weight:600;font-size:14.5px;margin:10px 0 0;text-align:center}
.foot-tray{padding:6px 0 calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:10px}
.key{height:56px;border-radius:18px;font-size:27px;font-weight:500;display:grid;place-items:center;font-family:var(--f-num)}
.key:active{background:var(--fill)}
.key[aria-disabled="true"]{color:var(--ink-3)}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 4px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:16px;font-size:12px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.2}
.cat .ico{transition:transform .25s var(--spring),box-shadow .2s}
.cat[aria-pressed="true"]{color:var(--ink)}
.cat[aria-pressed="true"] .ico{transform:scale(1.08);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.cat .ico.new{background:var(--fill);color:var(--ink-2)}
.flabel{font-size:14px;font-weight:600;color:var(--ink-2);margin:20px 0 8px}
.input{height:50px;border-radius:16px;border:0;background:var(--fill);padding:0 14px;color:var(--ink);width:100%;min-width:0;flex:none}
.input::placeholder{color:var(--ink-3)}
.input:focus{outline:none;box-shadow:0 0 0 2px var(--ink-3)}
.ichips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ichips .input{width:auto;flex:1;min-width:150px;height:34px;border-radius:999px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;background:var(--fill);border-radius:18px;margin-top:18px;text-align:left;flex:none}
.sw-row .t{font-weight:600;display:block}
.sw-row .s{font-size:13.5px;color:var(--ink-2)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--fill-2);position:relative;flex:none;transition:background .2s}

function processDue(){
  let n=0;
  for(const r of S.recurring){
    if(!r.active||!r.autoLog||!acc(r.accountId)) continue;
    while(r.nextDate<=TODAY){logRec(r,r.nextDate);r.nextDate=nextOcc(r,r.nextDate);n++}
  }

}

function upcoming(days){

function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function cumSeries(mk,upto){
  const [y,m]=mk.split('-').map(Number), n=dim(y,m-1), days=new Array(n).fill(0);
  for(const t of monthTx(mk)) if(t.type==='expense') days[parse(t.date).getDate()-1]+=t.amount;
  const out=[];let c=0;for(let i=0;i<Math.min(n,upto||n);i++){c+=days[i];out.push(c)}
  return out;
}
function smoothPath(pts){
  if(!pts.length) return '';
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];const mx=(x0+x1)/2;d+=`C${mx.toFixed(1)},${y0.toFixed(1)} ${mx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`}
  return d;
}
function cumSVG(mk,elapsed){
  const curS=cumSeries(mk,elapsed), prev=cumSeries(shiftMonth(mk,-1));
  const W=340,H=180,pl=2,pr=40,pt=14,pb=22, N=31;
  const max=niceMax(Math.max(1,...curS,...prev));
  const x=d=>pl+(W-pl-pr)*(d-1)/(N-1), y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';
  [0,.5,1].forEach(f=>{const yy=y(max*f);g+=`<text x="${W-pr+8}" y="${yy+4}">${compact(max*f)}</text>`});
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--fill-2)"/>`;
  [1,8,15,22,29].forEach(d=>g+=`<text x="${x(d)}" y="${H-4}" text-anchor="middle">${d}</text>`);
  if(prev.length) g+=`<path d="${smoothPath(prev.map((v,i)=>[x(i+1),y(v)]))}" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>`;
  if(curS.length){
    const L=curS.length;
    g+=`<path d="${smoothPath(curS.map((v,i)=>[x(i+1),y(v)]))}" fill="none" stroke="var(--chart-out)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    g+=`<circle cx="${x(L)}" cy="${y(curS[L-1])}" r="5.5" fill="var(--chart-out)" stroke="var(--bg)" stroke-width="2.5"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Running total of spending by day">${g}</svg>`;
}
function cashflowSVG(mk){
  const ks=[-5,-4,-3,-2,-1,0].map(i=>shiftMonth(mk,i));
  const data=ks.map(k=>Object.assign({k},sums(monthTx(k))));
  const W=340,H=170,pl=2,pr=40,pt=10,pb=24;
  const max=niceMax(Math.max(1,...data.map(d=>Math.max(d.inc,d.out))));
  const cw=(W-pl-pr)/6, bw=Math.min(14,cw*.26), ih=H-pt-pb;
  let g='';
  [0,.5,1].forEach(f=>{const yy=pt+ih*(1-f);g+=`<text x="${W-pr+8}" y="${yy+4}">${compact(max*f)}</text>`});
  data.forEach((d,i)=>{
    const cx=pl+cw*(i+.5), on=d.k===mk, op=on?1:.35;
    const hi=Math.max(d.inc>0?3:0,ih*d.inc/max), ho=Math.max(d.out>0?3:0,ih*d.out/max);
    g+=`<rect x="${cx-bw-2}" y="${H-pb-hi}" width="${bw}" height="${hi}" rx="${bw/2}" fill="var(--chart-in)" opacity="${op}"/>`;
    g+=`<rect x="${cx+2}" y="${H-pb-ho}" width="${bw}" height="${ho}" rx="${bw/2}" fill="var(--chart-out)" opacity="${op}"/>`;
    g+=`<text x="${cx}" y="${H-5}" text-anchor="middle" class="${on?'on':''}">${mShort(d.k)}</text>`;
    g+=`<rect x="${cx-cw/2}" y="0" width="${cw}" height="${H}" fill="transparent" data-act="insSet" data-val="${d.k}" style="cursor:pointer"><title>${mLong(d.k)}: in ${fmt(d.inc)}, out ${fmt(d.out)}</title></rect>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in and out for six months">${g}</svg>`;
}
function deltaChip(curV,prevV){
  if(!prevV) return curV?`<span class="delta flat">New</span>`:'';
  const p=(curV-prevV)/prevV*100;
  if(Math.abs(p)<2) return `<span class="delta flat">≈ same</span>`;
  const up=p>0;
  return `<span class="delta ${up?'up':'down'}">${up?'↑':'↓'} ${Math.abs(Math.round(p))}%</span>`;
}

function pressKey(k){
  const s=top();if(!s||s.kind!=='flow'||s.state.step!==1)return;
  const st=s.state, dp=cur().dp;let a=st.amt;
  if(k==='back')a=a.slice(0,-1);
  else if(k==='.'){if(dp===0||a.includes('.'))return;a=(a||'0')+'.'}
  else{
    if(a.includes('.')){if(a.split('.')[1].length>=dp)return}
    else if(a.length>=9)return;
    a=a==='0'?k:a+k;
  }
  st.amt=a;st.err='';st.pop=k!=='back';s.refresh();
}

const ACT={
  tab(el){UI.tab=el.dataset.tab;if(stack.length)closeAll();window.scrollTo(0,0);render()},
  homeTab(el){UI.homeTab=el.dataset.val;render()},
  closeSheet(){if(top()&&top().kind==='welcome')return;closeSheet()},
  addMenu(){openAddMenu()},
  add(el){if(el.dataset.close)closeSheet();openAdd({type:el.dataset.type,accountId:el.dataset.acc})},

  seeAll(){UI.f={q:'',type:'all',acc:null,cat:null,month:null};UI.tab='activity';window.scrollTo(0,0);render()},
  more(){UI.limit+=120;renderResults()},

  pick(el){const s=top(),o=s.options[+el.dataset.i];closeSheet();s.onPick(o.val)},
  yes(){const s=top();closeSheet();s.onYes()},
  undo(){if(UNDO){UNDO();UNDO=null;$('#toast').classList.remove('show')}},
  set(el){const s=top();s.state[el.dataset.key]=el.dataset.val;s.state.err='';s.refresh()},

  setType(el){const s=top(),st=s.state;st.type=el.dataset.val;st.err='';
    if(st.categoryId&&cat(st.categoryId).kind!==st.type)st.categoryId=null;
    if(st.type==='transfer'&&st.toAccountId===st.accountId){const o=S.accounts.find(a=>a.id!==st.accountId);if(o)st.toAccountId=o.id}
    s.refresh()},
  pickAcc(el){const parent=top(),st=parent.state,role=el.dataset.role;
    openPicker({title:role==='to'?'Move money to':(st.type==='income'?'Money goes into':'Pay from'),current:role==='to'?st.toAccountId:st.accountId,
      options:S.accounts.map(a=>({val:a.id,label:a.name,sub:fmt(bal(a)),lead:accIco(a)})),
      onPick:v=>{
        if(role==='to')st.toAccountId=v;else{if(st.type==='transfer'&&v===st.toAccountId)st.toAccountId=st.accountId;st.accountId=v}
        st.err='';parent.refresh();
      }});
  },
  flowNext(){const s=top();if(!s||s.kind!=='flow')return;const st=s.state;
    if(!(parseFloat(st.amt)>0)){st.err='Enter an amount above zero.';return s.refresh()}
    if(st.type==='transfer'){
      if(S.accounts.length<2){st.err='Add a second account to move money between accounts.';return s.refresh()}
      if(st.toAccountId===st.accountId){st.err='Pick two different accounts.';return s.refresh()}
    }
    st.step=2;st.err='';s.refresh()},
  flowBack(){const s=top();s.state.step=1;s.state.err='';s.refresh()},
  flowSave(){
    const s=top(),st=s.state;
    if(st.type!=='transfer'&&!st.categoryId){st.err='Pick a category so it shows up in Insights.';return s.refresh()}
    if(!st.date){st.err='Pick a date.';return s.refresh()}
    const amount=r2(parseFloat(st.amt));
    const data={type:st.type,amount,accountId:st.accountId,categoryId:st.type==='transfer'?null:st.categoryId,note:st.note.trim(),date:st.date};
    if(st.type==='transfer')data.toAccountId=st.toAccountId;
    let msg;
    if(st.editId){
      const t=S.txns.find(x=>x.id===st.editId);Object.assign(t,data);if(st.type!=='transfer')delete t.toAccountId;
      msg='Changes saved';
    }else{
      const t=addTx(data);
      msg={expense:'Expense added',income:'Income added',transfer:'Money moved'}[st.type];
      if(st.repeat){
        const r={id:uid('r'),name:data.note||cat(data.categoryId).name,type:data.type,amount,accountId:data.accountId,categoryId:data.categoryId,freq:st.freq,anchor:parse(st.date).getDate(),autoLog:true,active:true,created:st.date};
        r.nextDate=nextOcc(r,st.date);S.recurring.push(r);t.recurringId=r.id;processDue();
        msg+=` · repeats ${FREQ[st.freq].toLowerCase()}`;
      }
    }
    sortTx();closeSheet();render();toast(msg);
  },
  catNewInline(el){const parent=top(),key=el.dataset.key;openCatForm(null,{kind:el.dataset.kind,onSave:id=>{parent.state[key]=id;parent.state.err=''}})},
  txnEdit(el){const t=S.txns.find(x=>x.id===el.dataset.id);openAdd({txn:t})},
  txnRepeat(el){const t=S.txns.find(x=>x.id===el.dataset.id);closeSheet();openAdd({from:Object.assign({},t,{recurringId:null})})},
  txnDel(el){const id=el.dataset.id;confirmSheet({title:'Delete this transaction?',body:'It will be removed from your activity and your balances will update.',cta:'Delete',onYes:()=>{
    const i=S.txns.findIndex(t=>t.id===id);const [t]=S.txns.splice(i,1);closeAll();render();
    toast('Transaction deleted',()=>{S.txns.push(t);sortTx();render()});
  }})},
  accounts(){openAccounts()},
  categories(){openCategories()},
  currency(){openCurrency()},
  acc(el){openAccount(el.dataset.id)},
  accAll(el){UI.f={q:'',type:'all',acc:el.dataset.id,cat:null,month:null};UI.tab='activity';closeAll();window.scrollTo(0,0);render()},
  accNew(){openAccountForm()},
  accEdit(el){openAccountForm(el.dataset.id)},
  accSave(){const s=top(),st=s.state;
    if(!st.name.trim()){st.err='Give the account a name.';return s.refresh()}
    const op=parseFloat(String(st.opening).replace(/,/g,''))||0;
    if(st.id){Object.assign(acc(st.id),{name:st.name.trim(),type:st.type,opening:op,color:st.color});closeSheet();render();toast('Account updated')}
    else{S.accounts.push({id:uid('a'),name:st.name.trim(),type:st.type,opening:op,color:st.color});closeSheet();render();toast('Account added')}
  },
  accDel(el){const id=el.dataset.id,a=acc(id);
    const n=S.txns.filter(t=>t.accountId===id||t.toAccountId===id).length, nr=S.recurring.filter(r=>r.accountId===id).length;
    confirmSheet({title:`Delete ${esc(a.name)}?`,body:`${n?`This also deletes its ${n} transaction${n===1?'':'s'}`:'It has no transactions'}${nr?` and ${nr} recurring item${nr===1?'':'s'}`:''}. You can't undo this.`,cta:'Delete account',onYes:()=>{
      S.txns=S.txns.filter(t=>t.accountId!==id&&t.toAccountId!==id);S.recurring=S.recurring.filter(r=>r.accountId!==id);S.accounts=S.accounts.filter(x=>x.id!==id);
      if(UI.f.acc===id)UI.f.acc=null;closeAll();render();toast('Account deleted')}})},
  catEdit(el){openCatForm(el.dataset.id)},
  catNew(el){openCatForm(null,{kind:el.dataset.kind})},
  catSave(){const s=top(),st=s.state;
    if(!st.name.trim()){st.err='Give the category a name.';return s.refresh()}
    const bv=parseFloat(String(st.budget).replace(/,/g,''));
    const budget=st.kind==='expense'&&bv>0?Math.round(bv):null;
    let id=st.id;
    if(id)Object.assign(S.categories.find(c=>c.id===id),{name:st.name.trim(),icon:st.icon,color:st.color,budget});
    else{id=uid('c');const i=S.categories.findIndex(c=>c.locked&&c.kind===st.kind);S.categories.splice(i<0?S.categories.length:i,0,{id,kind:st.kind,name:st.name.trim(),icon:st.icon,color:st.color,budget})}
    const cb=s.onSave;closeSheet();if(cb)cb(id);render();toast(st.id?'Category updated':'Category created');
  },
  catDel(el){const id=el.dataset.id,c=cat(id),n=S.txns.filter(t=>t.categoryId===id).length;
    const other=c.kind==='income'?'i_other':'c_other';
    confirmSheet({title:`Delete ${esc(c.name)}?`,body:n?`Its ${n} transaction${n===1?'':'s'} and any recurring items move to “${cat(other).name}”.`:'Nothing uses this category yet.',cta:'Delete category',onYes:()=>{
      S.txns.forEach(t=>{if(t.categoryId===id)t.categoryId=other});S.recurring.forEach(r=>{if(r.categoryId===id)r.categoryId=other});
      S.categories=S.categories.filter(x=>x.id!==id);if(UI.f.cat===id)UI.f.cat=null;closeSheet();render();toast('Category deleted')}})},
  catDrill(el){UI.f={q:'',type:'expense',acc:null,cat:el.dataset.id,month:UI.insM};UI.tab='activity';window.scrollTo(0,0);render()},
  fType(){openPicker({title:'Show',current:UI.f.type,options:Object.entries(TYPE_L).map(([k,l])=>({val:k,label:k==='all'?'Everything':l})),onPick:v=>setF('type',v)})},
  fAcc(){openPicker({title:'Account',current:UI.f.acc,options:[{val:null,label:'All accounts'},...S.accounts.map(a=>({val:a.id,label:a.name,lead:accIco(a,'sm')}))],onPick:v=>setF('acc',v)})},
  fCat(){openPicker({title:'Category',current:UI.f.cat,options:[{val:null,label:'All categories'},...S.categories.map(c=>({val:c.id,label:c.name,sub:c.kind==='income'?'Income':'Spending',lead:catIco(c,'sm',17)}))],onPick:v=>setF('cat',v)})},
  fMonth(){const ms=[...new Set(S.txns.map(t=>mkey(t.date)))];openPicker({title:'Month',current:UI.f.month,options:[{val:null,label:'All time'},...ms.map(m=>({val:m,label:mLong(m)}))],onPick:v=>setF('month',v)})},
  fClear(el,e){e.stopPropagation();const k=el.dataset.key;if(k==='all'){UI.f={q:'',type:'all',acc:null,cat:null,month:null};const q=$('#q');if(q)q.value=''}else UI.f[k]=k==='type'?'all':null;UI.limit=120;renderResults()},
  insSet(el){UI.insM=el.dataset.val;render()},
  insAll(){UI.insAll=!UI.insAll;render()},
  recF(el){UI.recF=el.dataset.val;render()},
  rec(el){openRec(el.dataset.id)},
  recNew(el){if(el&&el.dataset&&el.dataset.close)closeSheet();openRecForm()},
  recEdit(el){openRecForm(el.dataset.id)},
  recTpl(el){const s=top(),t=TEMPLATES.filter(t=>S.categories.some(c=>c.id===t.categoryId))[+el.dataset.i];Object.assign(s.state,{name:t.name,type:t.type,categoryId:t.categoryId,err:''});s.refresh()},
  recType(el){const s=top();s.state.type=el.dataset.val;if(cat(s.state.categoryId).kind!==s.state.type)s.state.categoryId=s.state.type==='income'?'i_sal':'c_subs';s.refresh()},
  recSave(){const s=top(),st=s.state;const amount=r2(parseFloat(String(st.amt).replace(/,/g,'')));
    if(!st.name.trim()){st.err='Give it a name, like “Netflix” or “Rent”.';return s.refresh()}
    if(!(amount>0)){st.err='Enter an amount above zero.';return s.refresh()}
    if(!st.categoryId||!S.categories.some(c=>c.id===st.categoryId)){st.err='Pick a category.';return s.refresh()}
    if(!st.nextDate){st.err='Pick a date.';return s.refresh()}
    const data={name:st.name.trim(),type:st.type,amount,accountId:st.accountId,categoryId:st.categoryId,freq:st.freq,nextDate:st.nextDate,anchor:parse(st.nextDate).getDate(),autoLog:st.autoLog};
    if(st.id)Object.assign(S.recurring.find(r=>r.id===st.id),data);
    else S.recurring.push(Object.assign({id:uid('r'),active:true,created:st.nextDate},data));
    const n=processDue();closeSheet();render();toast(st.id?'Recurring item updated':`Scheduled · first one ${pdate(st.nextDate).toLowerCase()}${n?`, ${n} logged`:''}`);
  },
  recLog(el){const r=S.recurring.find(x=>x.id===el.dataset.id);
    const date=r.nextDate<=TODAY?r.nextDate:TODAY;logRec(r,date);r.nextDate=nextOcc(r,r.nextDate);sortTx();render();
    toast(`${r.name} logged · next ${pdate(r.nextDate).toLowerCase()}`)},
  recSkip(el){const r=S.recurring.find(x=>x.id===el.dataset.id);const was=r.nextDate;r.nextDate=nextOcc(r,r.nextDate);render();toast(`Skipped · next ${pdate(r.nextDate).toLowerCase()}`,()=>{r.nextDate=was;render()})},
  recPause(el){const r=S.recurring.find(x=>x.id===el.dataset.id);r.active=!r.active;
    if(r.active){let g=0;while(r.nextDate<TODAY&&g++<600)r.nextDate=nextOcc(r,r.nextDate)}
    render();toast(r.active?`${r.name} resumed`:`${r.name} paused`)},
  recDel(el){const r=S.recurring.find(x=>x.id===el.dataset.id);confirmSheet({title:`Delete ${esc(r.name)}?`,body:'Future payments stop being scheduled. Past transactions stay in your history.',cta:'Delete recurring item',onYes:()=>{
    S.recurring=S.recurring.filter(x=>x.id!==r.id);S.txns.forEach(t=>{if(t.recurringId===r.id)t.recurringId=null});closeAll();render();toast('Recurring item deleted')}})},
  curSave(){const s=top();if(s.state.code===APPCUR)return;APPCUR=s.state.code;closeAll();render();toast(`Now showing everything in ${APPCUR}`)},
  welcomeGo(){APPCUR=top().state.code;stack.pop().el.remove();document.body.style.overflow='';render();toast('All set. Tap + to start logging')},
  resetDemo(){confirmSheet({title:'Reload the sample data?',body:'Anything you added in this session is replaced with six months of example transactions.',cta:'Reload sample data',onYes:()=>{reset();closeAll();UI.f={q:'',type:'all',acc:null,cat:null,month:null};UI.insM=mkey(TODAY);render();toast('Sample data loaded')}})},
  clearAll(){confirmSheet({title:'Start with a clean slate?',body:'All sample accounts, transactions and recurring items are removed. Default categories stay, and you get one empty account called Cash.',cta:'Clear everything',onYes:()=>{
    S={accounts:[{id:'a1',name:'Cash',type:'Cash',opening:0,color:ACC_COLORS[0]}],categories:defaultCategories(),txns:[],recurring:[]};
    UI.f={q:'',type:'all',acc:null,cat:null,month:null};UI.insM=mkey(TODAY);UI.homeTab='recent';closeAll();UI.tab='home';render();setTimeout(openWelcome,300)}})}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.getAttribute('aria-disabled')==='true'||el.disabled){if(el.dataset.act==='flowNext')ACT.flowNext();return}
  const h=ACT[el.dataset.act];if(h){e.preventDefault();h(el,e)}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){UI.f.q=el.value;UI.limit=120;const r=$('#results');if(r)r.innerHTML=resultsHTML();return}
  if(el.dataset.bind){const s=top();if(s){s.state[el.dataset.bind]=el.value;s.state.err=''}}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.bind&&el.dataset.refresh){const s=top();if(s){s.state[el.dataset.bind]=el.value;s.refresh()}}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&stack.length){if(top().kind!=='welcome')closeSheet();return}
  const s=top();if(!s||s.kind!=='flow')return;
  if(e.target.matches('input,textarea,select'))return;
  if(s.state.step!==1){if(e.key==='Enter'&&!e.target.matches('button')){ACT.flowSave();e.preventDefault()}return}
  if(/^[0-9]$/.test(e.key)){pressKey(e.key);e.preventDefault()}
  else if(e.key==='.'||e.key===','){pressKey('.');e.preventDefault()}
  else if(e.key==='Backspace'){pressKey('back');e.preventDefault()}
  else if(e.key==='Enter'&&!e.target.matches('button')){ACT.flowNext();e.preventDefault()}
});

document.querySelectorAll('[data-ic]').forEach(el=>el.innerHTML=ic(el.dataset.ic,el.dataset.ic==='plus'?26:23,el.dataset.ic==='plus'?2.6:2.1));
reset();render();
window.__hisaab={get S(){return S},UI,bal,sums,monthTx,get cur(){return APPCUR}};
})();
</script>
</body>
